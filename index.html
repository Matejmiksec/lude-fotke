<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lude Fotke</title>
<style>
body { margin:0; background:#111; color:#fff; font-family:system-ui; display:flex; flex-direction:column; height:100vh; }
header { padding:10px; background:#222; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
button, label { background:#333; color:#fff; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:14px; }
button.primary { background:#e11d48; }
input[type=file] { display:none; }
#preview { flex:1; display:flex; align-items:center; justify-content:center; background:#000; overflow:hidden; }
canvas { max-width:100%; max-height:100%; }
.bar { padding:10px; background:#1a1a1a; overflow-x:auto; white-space:nowrap; }
.bar button { margin-right:6px; }
.bar button.active { background:#e11d48; }
.info { padding:6px 10px; font-size:13px; color:#aaa; background:#111; }
</style>
</head>
<body>
<header>
  <strong>Lude Fotke</strong>
  <label>📁 Slika<input type="file" id="file" accept="image/*"></label>
  <label>📷 Kamera<input type="file" id="cam" accept="image/*" capture="environment"></label>
  <button id="test">Test slika</button>
  <button id="dl" class="primary">Preuzmi</button>
</header>
<div class="info" id="info">Klikni "Test slika" ili učitaj svoju</div>
<div id="preview"><canvas id="c"></canvas></div>
<div class="bar" id="styles"></div>
<div class="bar" id="effects"></div>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const info = document.getElementById('info');
let img = null;
let effect = 'none';
let style = 'sve';

const styles = {
  sve: ['none','invert','grayscale','sepia','glitch','vhs','pixel'],
  bond: ['none','sepia','grayscale','contrast'],
  vintage: ['none','sepia','vhs','pixel'],
  cyber: ['none','glitch','invert','hue'],
  horror: ['none','invert','glitch','vhs'],
  neon: ['none','hue','glitch','saturate']
};
const names = {
  none:'Original', invert:'Invert', grayscale:'Crno-bijelo', sepia:'Sepia',
  glitch:'Glitch', vhs:'VHS', pixel:'Pixel', contrast:'Kontrast', hue:'Hue Shift', saturate:'Saturacija'
};

function makeButtons(container, list, current, cb) {
  container.innerHTML = '';
  list.forEach(id => {
    const b = document.createElement('button');
    b.textContent = names[id] || id;
    if (id === current) b.classList.add('active');
    b.onclick = () => cb(id);
    container.appendChild(b);
  });
}

function selectStyle(s) {
  style = s;
  effect = 'none';
  makeButtons(document.getElementById('styles'), Object.keys(styles), style, selectStyle);
  makeButtons(document.getElementById('effects'), styles[style], effect, e => { effect = e; draw(); });
  info.textContent = 'Stil: ' + s;
  draw();
}

function load(src) {
  const i = new Image();
  i.onload = () => { img = i; draw(); info.textContent = 'Slika učitana'; };
  i.src = src;
}

document.getElementById('file').onchange = e => {
  if (e.target.files[0]) load(URL.createObjectURL(e.target.files[0]));
};
document.getElementById('cam').onchange = e => {
  if (e.target.files[0]) load(URL.createObjectURL(e.target.files[0]));
};
document.getElementById('test').onclick = () => {
  const t = document.createElement('canvas');
  t.width = 400; t.height = 300;
  const tc = t.getContext('2d');
  tc.fillStyle = '#3498db'; tc.fillRect(0,0,400,300);
  tc.fillStyle = '#e74c3c'; tc.fillRect(50,50,150,100);
  tc.fillStyle = '#2ecc71'; tc.beginPath(); tc.arc(280,150,70,0,Math.PI*2); tc.fill();
  tc.fillStyle = '#fff'; tc.font = '24px sans-serif'; tc.fillText('Test', 160, 220);
  load(t.toDataURL());
};

function draw() {
  if (!img) return;
  const maxW = document.getElementById('preview').clientWidth || 800;
  const maxH = document.getElementById('preview').clientHeight || 500;
  const scale = Math.min(maxW / img.width, maxH / img.height, 1);
  c.width = img.width * scale;
  c.height = img.height * scale;

  ctx.filter = 'none';
  ctx.drawImage(img, 0, 0, c.width, c.height);

  if (effect === 'invert') ctx.filter = 'invert(100%)';
  else if (effect === 'grayscale') ctx.filter = 'grayscale(100%)';
  else if (effect === 'sepia') ctx.filter = 'sepia(100%)';
  else if (effect === 'contrast') ctx.filter = 'contrast(180%)';
  else if (effect === 'hue') ctx.filter = 'hue-rotate(90deg) saturate(150%)';
  else if (effect === 'saturate') ctx.filter = 'saturate(200%)';
  else if (effect === 'vhs') ctx.filter = 'contrast(120%) saturate(80%)';
  else if (effect === 'glitch') ctx.filter = 'contrast(150%) hue-rotate(20deg)';
  else if (effect === 'pixel') {
    const s = 8;
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, c.width / s);
    tmp.height = Math.max(1, c.height / s);
    const tctx = tmp.getContext('2d');
    tctx.drawImage(c, 0, 0, tmp.width, tmp.height);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(tmp, 0, 0, c.width, c.height);
    return;
  }

  if (effect !== 'none' && effect !== 'pixel') {
    ctx.drawImage(c, 0, 0);
  }
}

document.getElementById('dl').onclick = () => {
  if (!img) return alert('Nema slike');
  const a = document.createElement('a');
  a.download = 'fotka.png';
  a.href = c.toDataURL();
  a.click();
};

makeButtons(document.getElementById('styles'), Object.keys(styles), style, selectStyle);
makeButtons(document.getElementById('effects'), styles[style], effect, e => { effect = e; draw(); });
</script>
</body>
</html>
