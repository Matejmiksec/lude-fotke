<!DOCTYPE html>
<html lang="hr">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ff2d55">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lude Fotke & Clipovi</title>
<style>
  :root { --bg: #0a0a0a; --panel: #141414; --accent: #ff2d55; --text: #f0f0f0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 10px 12px; background: var(--panel); border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 1rem; font-weight: 600; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  button, label.btn { background: #222; color: var(--text); border: 1px solid #333; padding: 7px 12px; border-radius: 8px; font-size: 0.82rem; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); }
  input[type="file"] { display: none; }
  main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #preview-area { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; min-height: 200px; }
  #canvas { max-width: 100%; max-height: 100%; display: block; }
  #video { display: none; }
  .style-bar, .effect-bar { background: #111; padding: 8px 10px; overflow-x: auto; display: flex; gap: 6px; flex-shrink: 0; white-space: nowrap; }
  .style-btn, .effect-btn { padding: 7px 14px; border-radius: 20px; background: #1a1a1a; border: 1px solid #333; font-size: 0.8rem; cursor: pointer; }
  .style-btn.active, .effect-btn.active { background: var(--accent); border-color: var(--accent); }
  .slider-panel { background: var(--panel); padding: 10px 12px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.78rem; }
  .slider-panel label { display: flex; flex-direction: column; gap: 4px; min-width: 110px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .status { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 4px 10px; border-radius: 6px; font-size: 0.72rem; }
  .info { font-size: 0.72rem; color: #aaa; padding: 4px 12px; background: #0d0d0d; }
</style>
</head>
<body>
<header>
  <h1>Lude Fotke & Clipovi</h1>
  <div class="controls">
    <label class="btn">📷 Kamera<input type="file" id="camera" accept="image/*" capture="environment"></label>
    <label class="btn">📁 Slika<input type="file" id="image" accept="image/*"></label>
    <label class="btn">🎥 Video<input type="file" id="videoInput" accept="video/*"></label>
    <button id="download" class="primary">Preuzmi</button>
  </div>
</header>
<main>
  <div id="preview-area">
    <canvas id="canvas" width="800" height="600"></canvas>
    <video id="video" muted playsinline loop></video>
    <div class="status" id="status">Učitaj sliku ili video</div>
  </div>
  <div class="info" id="sceneInfo">Odaberi stil</div>
  <div class="style-bar" id="styles"></div>
  <div class="effect-bar" id="effects"></div>
  <div class="slider-panel">
    <label>Intenzitet <input type="range" id="intensity" min="0" max="100" value="75"></label>
    <label>Brzina <input type="range" id="speed" min="0" max="100" value="50"></label>
  </div>
</main>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const video = document.getElementById('video');
const statusEl = document.getElementById('status');
const intensitySlider = document.getElementById('intensity');
const speedSlider = document.getElementById('speed');
const sceneInfo = document.getElementById('sceneInfo');
const stylesContainer = document.getElementById('styles');
const effectsContainer = document.getElementById('effects');
let currentEffect = 'none';
let currentStyle = 'sve';
let source = null;
let isVideo = false;
let animId = null;
let frame = 0;
const styles = {
  sve: { name: "Sve", info: "Svi efekti", effects: ["none","glitch","vhs","crt","film","chromatic","pixel","invert","rgbshift"] },
  bond: { name: "Bond", info: "Špijunski stil – grain + chromatic", effects: ["none","film","chromatic","crt"] },
  vintage: { name: "Vintage", info: "Topli retro tonovi", effects: ["none","film","vhs","crt","pixel"] },
  cyber: { name: "Cyberpunk", info: "Glitch i RGB shift", effects: ["none","glitch","rgbshift","chromatic","invert"] },
  horror: { name: "Horror", info: "Mračni invert + glitch", effects: ["none","invert","glitch","vhs"] },
  noir: { name: "Film Noir", info: "Kontrast + grain", effects: ["none","film","crt","invert"] },
  neon: { name: "Neon", info: "Jaki RGB efekti", effects: ["none","rgbshift","chromatic","glitch"] },
  retro: { name: "Retro 80s", info: "VHS i CRT", effects: ["none","vhs","crt","pixel","film"] }
};
const effectNames = { none: "Original", glitch: "Glitch", vhs: "VHS", crt: "CRT", film: "Film Grain", chromatic: "Chromatic", pixel: "Pixelate", invert: "Invert", rgbshift: "RGB Shift" };
function buildUI() {
  stylesContainer.innerHTML = "";
  Object.keys(styles).forEach(key => {
    const btn = document.createElement("button");
    btn.className = "style-btn" + (key === currentStyle ? " active" : "");
    btn.textContent = styles[key].name;
    btn.onclick = () => selectStyle(key);
    stylesContainer.appendChild(btn);
  });
  renderEffects();
}
function selectStyle(key) {
  currentStyle = key;
  document.querySelectorAll(".style-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  sceneInfo.textContent = styles[key].info;
  currentEffect = "none";
  renderEffects();
}
function renderEffects() {
  const list = styles[currentStyle].effects;
  effectsContainer.innerHTML = "";
  list.forEach(eff => {
    const btn = document.createElement("button");
    btn.className = "effect-btn" + (eff === currentEffect ? " active" : "");
    btn.textContent = effectNames[eff] || eff;
    btn.onclick = () => {
      currentEffect = eff;
      document.querySelectorAll(".effect-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    };
    effectsContainer.appendChild(btn);
  });
}
function resizeCanvas() {
  const area = document.getElementById('preview-area');
  const w = area.clientWidth || 800;
  const h = area.clientHeight || 500;
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 100);
function loadImage(file) {
  const img = new Image();
  img.onload = () => {
    source = img;
    isVideo = false;
    if (video.src) { video.pause(); video.src = ""; }
    statusEl.textContent = "Slika učitana";
    startLoop();
  };
  img.onerror = () => statusEl.textContent = "Greška pri učitavanju slike";
  img.src = URL.createObjectURL(file);
}
function loadVideo(file) {
  video.src = URL.createObjectURL(file);
  video.onloadedmetadata = () => {
    source = video;
    isVideo = true;
    video.play().catch(() => {});
    statusEl.textContent = "Video učitan";
    startLoop();
  };
  video.onerror = () => statusEl.textContent = "Greška pri učitavanju videa";
}
document.getElementById('image').onchange = e => { if (e.target.files[0]) loadImage(e.target.files[0]); };
document.getElementById('camera').onchange = e => { if (e.target.files[0]) loadImage(e.target.files[0]); };
document.getElementById('videoInput').onchange = e => { if (e.target.files[0]) loadVideo(e.target.files[0]); };
function startLoop() {
  if (animId) cancelAnimationFrame(animId);
  function loop() { draw(); frame++; animId = requestAnimationFrame(loop); }
  loop();
}
function draw() {
  if (!source) return;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  let sw = isVideo ? video.videoWidth : source.width;
  let sh = isVideo ? video.videoHeight : source.height;
  if (!sw || !sh) return;
  const scale = Math.min(canvas.width / sw, canvas.height / sh);
  const dw = sw * scale;
  const dh = sh * scale;
  const dx = (canvas.width - dw) / 2;
  const dy = (canvas.height - dh) / 2;
  ctx.drawImage(source, dx, dy, dw, dh);
  if (currentEffect === "none") return;
  try {
    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    applyEffect(imgData.data, canvas.width, canvas.height, currentEffect, intensitySlider.value / 100, speedSlider.value / 50, frame);
    ctx.putImageData(imgData, 0, 0);
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Greška u efektu";
  }
}
function applyEffect(data, w, h, effect, intensity, speed, frame) {
  const len = data.length;
  for (let i = 0; i < len; i += 4) {
    let r = data[i], g = data[i+1], b = data[i+2];
    if (effect === "invert") {
      data[i] = 255 - r; data[i+1] = 255 - g; data[i+2] = 255 - b;
    } else if (effect === "glitch") {
      if (Math.random() < 0.015 * intensity) {
        data[i] = Math.random() * 255; data[i+1] = Math.random() * 255; data[i+2] = Math.random() * 255;
      }
      const shift = Math.floor(Math.sin(frame * 0.15 * speed) * 20 * intensity);
      const ni = i + shift * 4;
      if (ni >= 0 && ni < len) data[i] = data[ni];
    } else if (effect === "vhs") {
      const noise = (Math.random() - 0.5) * 50 * intensity;
      data[i] = Math.max(0, Math.min(255, r + noise));
      data[i+1] = Math.max(0, Math.min(255, g + noise * 0.5));
      data[i+2] = Math.max(0, Math.min(255, b + noise * 0.2));
    } else if (effect === "crt") {
      const y = Math.floor((i / 4) / w);
      if (y % 2 === 0) { data[i] *= 0.6; data[i+1] *= 0.6; data[i+2] *= 0.6; }
    } else if (effect === "film") {
      const grain = (Math.random() - 0.5) * 70 * intensity;
      data[i] = Math.max(0, Math.min(255, r + grain));
      data[i+1] = Math.max(0, Math.min(255, g + grain));
      data[i+2] = Math.max(0, Math.min(255, b + grain));
    } else if (effect === "chromatic") {
      const off = Math.floor(10 * intensity);
      if (i + off * 4 < len) data[i] = data[i + off * 4];
      if (i - off * 4 >= 0) data[i+2] = data[i - off * 4];
    } else if (effect === "pixel") {
      const size = Math.max(3, Math.floor(16 * intensity));
      const x = (i / 4) % w;
      const y = Math.floor((i / 4) / w);
      if (x % size !== 0 || y % size !== 0) {
        const px = Math.floor(x / size) * size;
        const py = Math.floor(y / size) * size;
        const idx = (py * w + px) * 4;
        if (idx < len) { data[i] = data[idx]; data[i+1] = data[idx+1]; data[i+2] = data[idx+2]; }
      }
    } else if (effect === "rgbshift") {
      const shift = Math.floor(Math.sin(frame * 0.08 * speed) * 12 * intensity);
      const ni = Math.max(0, Math.min(len - 4, i + shift * 4));
      data[i] = data[ni];
      data[i+2] = data[Math.max(0, i - shift * 4)];
    }
  }
}
document.getElementById('download').onclick = () => {
  if (!source) return alert("Prvo učitaj sliku ili video");
  const a = document.createElement("a");
  a.download = "lude-fotke.png";
  a.href = canvas.toDataURL("image/png");
  a.click();
};
buildUI();
resizeCanvas();
statusEl.textContent = "Učitaj sliku ili video da počneš";
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/sw.js").catch(console.error);
}
</script>
</body>
</html>
